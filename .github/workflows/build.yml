name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ig_tools binary (PyInstaller)
        run: |
          pip install -r electron/scripts/requirements.txt pyinstaller
          cd electron/scripts
          pyinstaller --onefile --name ig_tools ig_tools.py
          mv dist/ig_tools ./ig_tools
          rm -rf build dist ig_tools.spec

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (macOS DMG)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --config electron-builder.prod.yml --publish always

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ig_tools binary (PyInstaller)
        run: |
          pip install -r electron/scripts/requirements.txt pyinstaller
          cd electron/scripts
          pyinstaller --onefile --name ig_tools ig_tools.py
          move dist\ig_tools.exe .\ig_tools.exe
          rmdir /s /q build dist
          del ig_tools.spec
        shell: cmd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (Windows NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.win.yml --publish always
